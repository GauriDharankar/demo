<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background: #2d2d2d;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        .display {
            background: #1a1a1a;
            color: #00ff00;
            font-size: 32px;
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 60px;
            word-wrap: break-word;
            word-break: break-all;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .number, .decimal {
            background: #404040;
            color: #ffffff;
        }

        .number:hover, .decimal:hover {
            background: #505050;
        }

        .operator {
            background: #667eea;
            color: #ffffff;
        }

        .operator:hover {
            background: #5568d3;
        }

        .equals {
            background: #00ff00;
            color: #000000;
            grid-column: span 2;
        }

        .equals:hover {
            background: #00cc00;
        }

        .clear {
            background: #ff4444;
            color: #ffffff;
            grid-column: span 2;
        }

        .clear:hover {
            background: #dd3333;
        }

        .scientific {
            background: #764ba2;
            color: #ffffff;
        }

        .scientific:hover {
            background: #653a8a;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <!-- Row 1: Scientific Functions -->
            <button class="scientific" onclick="appendFunction('sin(')">sin</button>
            <button class="scientific" onclick="appendFunction('cos(')">cos</button>
            <button class="scientific" onclick="appendFunction('tan(')">tan</button>
            <button class="scientific" onclick="appendFunction('Math.sqrt(')">√</button>

            <!-- Row 2: More Scientific Functions -->
            <button class="scientific" onclick="appendFunction('Math.log10(')">log</button>
            <button class="scientific" onclick="appendFunction('Math.log(')">ln</button>
            <button class="scientific" onclick="appendFunction('Math.pow(')">x^y</button>
            <button class="scientific" onclick="appendFunction('Math.PI')">π</button>

            <!-- Row 3: Number Pad -->
            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('/')">/</button>

            <!-- Row 4: Number Pad -->
            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('*')">*</button>

            <!-- Row 5: Number Pad -->
            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <!-- Row 6: Number Pad -->
            <button class="number" onclick="appendNumber('0')">0</button>
            <button class="decimal" onclick="appendNumber('.')">.</button>
            <button class="operator" onclick="appendOperator('+')">+</button>
            <button class="clear" onclick="clearDisplay()">C</button>

            <!-- Row 7: Equals -->
            <button class="equals" onclick="calculate()">=</button>
            <button class="clear" onclick="deleteLast()">DEL</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else if (num === '.' && currentInput.includes('.')) {
                return;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '') return;
            currentInput += op;
            updateDisplay();
        }

        function appendFunction(func) {
            if (currentInput === '0') {
                currentInput = func;
            } else {
                currentInput += func;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1) || '0';
            updateDisplay();
        }

        function calculate() {
            try {
                // Replace mathematical functions with their Math equivalents
                let expression = currentInput
                    .replace(/sin/g, 'Math.sin')
                    .replace(/cos/g, 'Math.cos')
                    .replace(/tan/g, 'Math.tan')
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E');
                
                // Evaluate the expression
                let result = eval(expression);
                
                // Round to avoid floating point errors
                result = Math.round(result * 10000000000) / 10000000000;
                currentInput = result.toString();
                updateDisplay();
            } catch (error) {
                display.textContent = 'Error';
                currentInput = '0';
            }
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
